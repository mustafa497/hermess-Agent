[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent"
version = "0.1.0"
description = "Fully local agentic workflow system on Nous Research Hermes via Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "certifi>=2024.2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
memory = ["numpy>=1.26"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
hermes = "hermes_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "ollama: integration test requiring a live local Ollama with the configured model pulled",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer expresses CLI options as call-valued defaults; that is the framework idiom.
"src/hermes_agent/cli.py" = ["B008"]
"tests/*" = ["E501"]


[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
